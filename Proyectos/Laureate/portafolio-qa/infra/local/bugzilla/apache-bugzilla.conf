# El puerto y el nombre de host los define el entrypoint a partir de
# BUGZILLA_LISTEN_PORT y BUGZILLA_SERVER_NAME. Deben coincidir con el puerto
# publicado en docker-compose.yml para que la URL de Bugzilla sea la misma
# desde el navegador y desde otros contenedores (Kiwi TCMS).
<VirtualHost *:${BUGZILLA_LISTEN_PORT}>
    ServerName ${BUGZILLA_SERVER_NAME}
    ServerAlias localhost
    DocumentRoot /var/www/html/bugzilla

    <Directory /var/www/html/bugzilla>
        AddHandler cgi-script .cgi
        Options +ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/bugzilla/data>
        Options -Indexes
        Require all denied
    </Directory>

    <Directory /var/www/html/bugzilla/localconfig.d>
        Require all denied
    </Directory>

    <Files "localconfig">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/bugzilla_error.log
    CustomLog ${APACHE_LOG_DIR}/bugzilla_access.log combined
</VirtualHost>
